[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nodict"
version = "0.2.0"
description = "Slim offline Norwegian<->English dictionary + active-vocabulary drills"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Staale Nataas" }]
dependencies = []

[project.scripts]
nodict = "nodict.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nodict = ["data/*.json"]
